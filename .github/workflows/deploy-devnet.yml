name: Deploy na devnet

# Rodado manualmente. As chaves de devnet (sem valor real) ficam no cache do GitHub Actions
# do próprio repositório, para os próximos deploys atualizarem o mesmo programa.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-devnet
  cancel-in-progress: false

env:
  AGAVE_VERSION: "4.3.0"
  KEYS_DIR: .devnet-keys

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/solana-setup

      - name: Restaurar chaves de devnet
        id: keys
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KEYS_DIR }}
          key: devnet-keys-v1

      - name: Gerar chaves (primeira vez)
        if: steps.keys.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$KEYS_DIR"
          solana-keygen new --no-bip39-passphrase --silent -o "$KEYS_DIR/deployer.json"
          solana-keygen new --no-bip39-passphrase --silent -o "$KEYS_DIR/program.json"

      - name: Salvar chaves
        if: steps.keys.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KEYS_DIR }}
          key: devnet-keys-v1

      - name: Configurar carteira e programa
        run: |
          mkdir -p ~/.config/solana target/deploy
          cp "$KEYS_DIR/deployer.json" ~/.config/solana/id.json
          cp "$KEYS_DIR/program.json" target/deploy/cambi_pool-keypair.json
          solana config set --url https://api.devnet.solana.com
          echo "DEPLOYER=$(solana address)" >> "$GITHUB_ENV"
          echo "PROGRAM_ID=$(solana address -k target/deploy/cambi_pool-keypair.json)" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          anchor keys sync
          sed -i "s/^cambi_pool = \".*\"/cambi_pool = \"$(solana address -k target/deploy/cambi_pool-keypair.json)\"/" Anchor.toml
          anchor build
          test "$(node -p "require('./target/idl/cambi_pool.json').address")" = "$PROGRAM_ID"
          ls -la target/deploy/

      - name: Recuperar SOL de buffers de deploys interrompidos
        run: solana program close --buffers --bypass-warning || echo "Nenhum buffer para fechar"

      - name: Verificar saldo de SOL de devnet
        run: |
          for i in 1 2 3; do solana airdrop 2 || true; sleep 5; done
          BAL=$(solana balance | awk '{print $1}')
          SIZE=$(stat -c%s target/deploy/cambi_pool.so)
          MAX_LEN=$((SIZE * 5 / 4))
          echo "MAX_LEN=$MAX_LEN" >> "$GITHUB_ENV"
          # Pico durante o deploy: buffer (tamanho do programa) + conta do programa (com 25% de folga)
          NEED=$(awk -v a="$(solana rent $SIZE | awk '/Rent-exempt minimum/ {print $3}')" \
                     -v b="$(solana rent $MAX_LEN | awk '/Rent-exempt minimum/ {print $3}')" 'BEGIN {printf "%.2f", a + b}')
          echo "Saldo: $BAL SOL | programa: $SIZE bytes | necessário (aprox.): $NEED SOL + taxas"
          if awk "BEGIN {exit !($BAL < $NEED + 0.5)}"; then
            {
              echo "## Falta SOL de devnet"
              echo ""
              echo "A carteira de deploy precisa de pelo menos **$NEED + 0,5 SOL** de devnet e tem **$BAL SOL**."
              echo ""
              echo "1. Abra https://faucet.solana.com"
              echo "2. Cole o endereço: \`$DEPLOYER\`"
              echo "3. Peça 5 SOL (pode precisar repetir) e rode este workflow de novo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Saldo insuficiente. Envie SOL de devnet para $DEPLOYER (faucet.solana.com)"
            exit 1
          fi

      - name: Deploy do programa
        timeout-minutes: 150
        run: |
          # Já implantado com este mesmo binário? Então não gasta SOL de novo.
          if solana program dump "$PROGRAM_ID" /tmp/onchain.so 2>/dev/null \
             && cmp -s -n "$(stat -c%s target/deploy/cambi_pool.so)" target/deploy/cambi_pool.so /tmp/onchain.so; then
            echo "Programa já está na devnet com este binário."
            solana program show "$PROGRAM_ID"
            exit 0
          fi
          # Escreve num buffer com chave fixa: se a RPC pública falhar, a próxima tentativa
          # retoma o mesmo buffer e só reescreve os pedaços que faltam.
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/buffer.json
          BUFFER=$(solana address -k /tmp/buffer.json)
          ok=0
          for i in 1 2 3 4 5 6; do
            MODE=""; [ $((i % 2)) -eq 1 ] && MODE="--use-rpc"
            echo "::group::Escrita do buffer $BUFFER, tentativa $i ${MODE:-(TPU)}"
            if timeout 25m solana program write-buffer target/deploy/cambi_pool.so \
                 --buffer /tmp/buffer.json \
                 --with-compute-unit-price 100000 \
                 --max-sign-attempts 100 $MODE; then ok=1; echo "::endgroup::"; break; fi
            echo "::endgroup::"
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            solana program close "$BUFFER" --bypass-warning || true
            echo "::error::Não foi possível escrever o programa na devnet (RPC pública instável). Rode o workflow de novo."
            exit 1
          fi
          solana program deploy \
            --buffer /tmp/buffer.json \
            --program-id target/deploy/cambi_pool-keypair.json \
            --max-len "$MAX_LEN" \
            --with-compute-unit-price 100000 \
            --max-sign-attempts 100 \
            --use-rpc
          solana program show "$PROGRAM_ID"

      - name: Montar o pool de demonstração e registrar as provas
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: npm run devnet:setup

      - name: Publicar endereços no repositório
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p idl
          cp target/idl/cambi_pool.json idl/cambi_pool.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/cambi_pool/src/lib.rs Anchor.toml deployments/devnet.json app/src/devnet.json idl/cambi_pool.json
          git commit -m "Deploy na devnet: programa $PROGRAM_ID" || echo "nada para commitar"
          # Credencial usada só neste passo (o checkout não deixa o token salvo no disco).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Republicar a demo com os dados da devnet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
