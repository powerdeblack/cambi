name: Diagnóstico do loader por CPI (devnet, branch v2)

# Testa se a devnet aceita instruções do BPF Loader Upgradeable feitas pelo cofre de uma multisig (CPI), com uma
# multisig 1 de 1 e um programa vazio descartáveis (diag/noop). Não toca o programa da cambI nem o pool.
# Para rodar: altere deployments/diag-round.txt no branch v2.
on:
  push:
    branches: [v2]
    paths:
      - deployments/diag-round.txt

permissions:
  contents: write

env:
  AGAVE_VERSION: "4.3.0"
  AGAVE_INSTALL_SHA256: de7be8bb4fdf52751680c967d05bac435affadbdbfb0efd0d6e33c365bd84fff

concurrency:
  group: program-v2-devnet
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v2
          persist-credentials: false
      - uses: ./.github/actions/solana-setup
      - name: Restaurar chave do deployer (devnet)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v2
      - name: Multisig de teste (1 de 1)
        env:
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: |
          mkdir -p ~/.config/solana && cp .devnet-keys/deployer.json ~/.config/solana/id.json
          solana config set --url https://api.devnet.solana.com
          npx tsx scripts/diag-loader-cpi.ts setup
      - name: Programa vazio com o cofre de teste como autoridade
        run: |
          cargo build-sbf --manifest-path diag/noop/Cargo.toml --sbf-out-dir /tmp/noop
          ls -l /tmp/noop
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/noop-program.json
          solana program deploy /tmp/noop/diag_noop.so --program-id /tmp/noop-program.json --with-compute-unit-price 100000 --max-sign-attempts 50
          PROGRAM=$(solana address -k /tmp/noop-program.json)
          solana program set-upgrade-authority "$PROGRAM" --new-upgrade-authority "$DIAG_VAULT" --skip-new-upgrade-authority-signer-check
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/noop-buffer.json
          solana program write-buffer /tmp/noop/diag_noop.so --buffer /tmp/noop-buffer.json --with-compute-unit-price 100000
          BUFFER=$(solana address -k /tmp/noop-buffer.json)
          solana program set-buffer-authority "$BUFFER" --new-buffer-authority "$DIAG_VAULT"
          echo "NOOP_PROGRAM=$PROGRAM" >> "$GITHUB_ENV"
          echo "NOOP_BUFFER=$BUFFER" >> "$GITHUB_ENV"
      - name: Testes (Upgrade e extensão por CPI; extensão direta)
        env:
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npx tsx scripts/diag-loader-cpi.ts run
      - name: Publicar o resultado no branch v2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .devnet-keys
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f deployments/diag-loader-cpi.json ]; then git add deployments/diag-loader-cpi.json; fi
          git commit -q -m "Diagnóstico do loader por CPI [skip ci]" || exit 0
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull -q --rebase "$url" v2
          git push -q "$url" HEAD:v2
