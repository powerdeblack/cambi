name: Consórcio de Baleias (devnet, branch v2)

# Só no branch v2. Monta (na primeira vez) o pool do consórcio governado por uma multisig Squads de 10 Baleias
# (7 de 10) e, a cada nova execução, faz uma rodada de cotação validada pela multisig. O pool avaliado não é tocado.
# Para rodar de novo: altere deployments/consortium-round.txt no branch v2.
on:
  push:
    branches: [v2]
    paths:
      - scripts/consortium.ts
      - .github/workflows/consortium-devnet.yml
      - deployments/consortium-round.txt

permissions:
  contents: write

concurrency:
  group: consortium-devnet
  cancel-in-progress: false

jobs:
  consortium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Restaurar chaves do deployer (devnet)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v2
      - name: Restaurar chaves das 10 Baleias
        id: baleias
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .consortium-keys
          key: consortium-keys-v1

      - name: Consórcio (montagem ou rodada de cotação)
        env:
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npx tsx scripts/consortium.ts

      - name: Guardar chaves das Baleias (só na primeira vez)
        if: always() && steps.baleias.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .consortium-keys
          key: consortium-keys-v1

      - name: Publicar o registro do consórcio no branch v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .devnet-keys .consortium-keys
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/devnet-consortium.json app/src/devnet.json
          git commit -q -m "Consórcio de Baleias: registro na devnet [skip ci]" || exit 0
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull -q --rebase "$url" v2
          git push -q "$url" HEAD:v2
