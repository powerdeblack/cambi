name: Programa Solana (testes de integração)

# Sem gatilho de pull_request: código vindo de forks não roda neste repositório (protege as chaves de devnet).
on:
  push:
  workflow_dispatch:

env:
  AGAVE_VERSION: "4.3.0"
  AGAVE_INSTALL_SHA256: de7be8bb4fdf52751680c967d05bac435affadbdbfb0efd0d6e33c365bd84fff

permissions:
  contents: read

jobs:
  anchor-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/solana-setup
      - name: Carteira local de teste
        run: solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json
      - name: Gerar a chave do programa e sincronizar o ID
        run: |
          anchor build -- --features devnet
          anchor keys sync
          sed -i "s/^cambi_pool = \".*\"/cambi_pool = \"$(solana address -k target/deploy/cambi_pool-keypair.json)\"/" Anchor.toml
          anchor build -- --features devnet
          # O faucet de testes tem que estar nesta versão (devnet) e no IDL.
          node -e 'const i=require("./target/idl/cambi_pool.json").instructions.map(x=>x.name); if(!i.includes("faucet_claim")) { console.error("IDL sem faucet_claim:", i); process.exit(1) } console.log(i.join(", "))'
      - name: Versão de produção não tem faucet
        run: |
          cargo build-sbf --manifest-path programs/cambi_pool/Cargo.toml --sbf-out-dir /tmp/prod
          ! grep -a -q "faucet_claim\|FaucetClaim" /tmp/prod/cambi_pool.so
          echo "OK: binário de produção sem instruções de faucet"
      - name: Conferir IDs
        run: |
          echo "chave:    $(solana address -k target/deploy/cambi_pool-keypair.json)"
          echo "código:   $(grep -o 'declare_id!("[^"]*")' programs/cambi_pool/src/lib.rs)"
          echo "IDL:      $(node -e 'console.log(require("./target/idl/cambi_pool.json").address)')"
          grep -A1 "programs.localnet" Anchor.toml
      - name: Testar numa Solana local
        run: anchor test --skip-build
      - name: Tamanho do programa
        run: ls -la target/deploy/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cambi_pool-build
          path: |
            target/deploy/cambi_pool.so
            target/idl/cambi_pool.json
