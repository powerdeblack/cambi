name: Programa Solana (testes de integração)

# Sem gatilho de pull_request: código vindo de forks não roda neste repositório (protege as chaves de devnet).
on:
  push:
  workflow_dispatch:

env:
  AGAVE_VERSION: "4.3.0"

permissions:
  contents: read

jobs:
  anchor-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/solana-setup
      - name: Carteira local de teste
        run: solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json
      - name: Gerar a chave do programa e sincronizar o ID
        run: |
          anchor build
          anchor keys sync
          sed -i "s/^cambi_pool = \".*\"/cambi_pool = \"$(solana address -k target/deploy/cambi_pool-keypair.json)\"/" Anchor.toml
          anchor build
      - name: Conferir IDs
        run: |
          echo "chave:    $(solana address -k target/deploy/cambi_pool-keypair.json)"
          echo "código:   $(grep -o 'declare_id!("[^"]*")' programs/cambi_pool/src/lib.rs)"
          echo "IDL:      $(node -e 'console.log(require("./target/idl/cambi_pool.json").address)')"
          grep -A1 "programs.localnet" Anchor.toml
      - name: Testar numa Solana local
        run: anchor test --skip-build
      - name: Tamanho do programa
        run: ls -la target/deploy/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cambi_pool-build
          path: |
            target/deploy/cambi_pool.so
            target/idl/cambi_pool.json
