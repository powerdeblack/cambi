name: Teste de ponta a ponta na devnet

# Roda o mesmo cliente que o app usa contra o programa real na devnet: conta nova, troca, Rende, envio e resgate.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-devnet
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm


      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: app

      - name: Restaurar chave do admin (devnet)
        id: keys
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v2
      - name: Manutenção (SOL do oráculo, liquidez do pool)
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npm run devnet:maintain

      - name: Conta nova → faucet do programa → troca → Rende → envio
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npm run devnet:e2e

  ui:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
        working-directory: app

      - run: npm run build
        working-directory: app

      - name: Instalar navegador (Playwright travado no package-lock da raiz)
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Restaurar chave do admin (devnet), depois de instalar tudo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v2

      - name: Telas do app contra a devnet (conta, troca, Rende, Pix)
        env:
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: |
          (cd app && npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          sleep 3
          node scripts/ui-e2e.cjs http://localhost:4173/ ui-e2e

      - name: Guardar prints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-e2e-prints
          path: ui-e2e/
          if-no-files-found: ignore
