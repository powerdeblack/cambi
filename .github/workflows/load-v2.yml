name: Teste em escala v2.6 (devnet, branch v2)

# Só no branch v2. Refaz com muitas carteiras os testes citados no white paper (cadastro, KYC, trocas, divisão da
# taxa, Rende, fila, guardião + governança) e termina com um estresse econômico (corrida ao dólar e recuperação).
# Roda no pool v2.6 (guardião sem chave). Antes, uma rodada de cotação pelo conselho de teste deixa o preço em dia.
# Relatório: deployments/load-v2-report.json (sem endereços de carteira).
# Para rodar: altere deployments/load-round.txt no branch v2 (a primeira linha pode ser o número de carteiras).
on:
  push:
    branches: [v2]
    paths:
      - deployments/load-round.txt

permissions:
  contents: write

concurrency:
  group: program-v2-devnet
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restaurar chave do deployer (devnet)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v2
      - name: Rodada de cotação pelo conselho de teste
        continue-on-error: true
        env:
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npx tsx scripts/pool-v26.ts
      - name: Teste em escala e estresse econômico
        env:
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: |
          USERS=$(head -n1 deployments/load-round.txt | grep -oE '^[0-9]+' || true)
          LOAD_USERS=${USERS:-1000} npx tsx scripts/load-v2.ts
      - name: Publicar o relatório no branch v2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .devnet-keys
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in deployments/load-v2-report.json deployments/devnet-v26.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -q -m "Teste em escala v2.6: relatório [skip ci]" || exit 0
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull -q --rebase "$url" v2
          git push -q "$url" HEAD:v2
