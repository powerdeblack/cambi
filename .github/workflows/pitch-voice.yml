name: Narração do pitch (voz sintética)

# Rodado manualmente. Gera um áudio por frase de docs/pitch/narracao.json com o Piper (voz neural aberta, pt-BR)
# e publica os arquivos no branch "voice", para montar o vídeo de apresentação.
on:
  workflow_dispatch:
    inputs:
      idioma:
        description: "pt (português) ou en (inglês)"
        default: pt
        type: choice
        options: [pt, en]

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Instalar o Piper (versão fixa)
        run: python3 -m pip install --quiet piper-tts==1.8.0
      - name: Baixar a voz (pt-BR faber ou en-US ryan)
        env:
          IDIOMA: ${{ inputs.idioma }}
        run: |
          mkdir -p /tmp/voz
          if [ "$IDIOMA" = "en" ]; then path=en/en_US/ryan/high/en_US-ryan-high; else path=pt/pt_BR/faber/medium/pt_BR-faber-medium; fi
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          curl -sSfL "$base/$path.onnx" -o /tmp/voz/voz.onnx
          curl -sSfL "$base/$path.onnx.json" -o /tmp/voz/voz.onnx.json
          sha256sum /tmp/voz/*
      - name: Gerar um áudio por frase
        env:
          IDIOMA: ${{ inputs.idioma }}
        run: |
          mkdir -p /tmp/out
          python3 - <<'PY'
          import json, os, subprocess
          campo = "speech_en" if os.environ["IDIOMA"] == "en" else "fala"
          for x in json.load(open("docs/pitch/narracao.json")):
              cmd = ["python3", "-m", "piper", "-m", "/tmp/voz/voz.onnx", "-f", f"/tmp/out/{x['id']}.wav"]
              # Versões novas aceitam o texto como argumento; as antigas, pela entrada padrão.
              if subprocess.run(cmd + ["--", x[campo]]).returncode != 0:
                  subprocess.run(cmd, input=x[campo].encode(), check=True)
          PY
          ls -la /tmp/out | head -40
      - name: Publicar no branch "voice" (ou "voice-en")
        env:
          GH_TOKEN: ${{ github.token }}
          IDIOMA: ${{ inputs.idioma }}
        run: |
          cd /tmp/out
          git init -q -b voice
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Narração do pitch [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:$([ "$IDIOMA" = "en" ] && echo voice-en || echo voice)
