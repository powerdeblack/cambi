name: Oráculo da devnet

# Grava no pool da devnet a cotação real do dólar (Coinbase, com fontes de reserva) a cada 15 minutos.
# Na mainnet, este papel seria do Pyth lido direto pelo programa (ver docs/ARQUITETURA.md).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-devnet
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm ci --ignore-scripts
        working-directory: app

      - name: Restaurar chave do oráculo (devnet)
        id: keys
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v1
      - name: Conferir chave
        if: steps.keys.outputs.cache-hit != 'true'
        run: |
          echo "::error::Chave de devnet não encontrada no cache. Rode o workflow 'Deploy na devnet' antes."
          exit 1

      - name: Manter o patrocinador do app (SOL e moedas de teste)
        continue-on-error: true
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npm run devnet:sponsor

      - name: Gravar cotação ao vivo no pool
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: .devnet-keys/deployer.json
        run: npm run devnet:price
