name: Oráculo da devnet

# Grava no pool a cotação do dólar por consenso de fontes (mediana das que concordam) a cada 15 minutos.
# Usa SÓ a chave do oráculo (a de admin é apagada do disco logo após restaurar o cache).
# Na mainnet, este papel seria do Pyth lido direto pelo programa (ver docs/ARQUITETURA.md).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-devnet
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: app

      - name: Restaurar chave do oráculo (devnet)
        id: keys
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devnet-keys
          key: devnet-keys-v2
      - name: Manter só a chave do oráculo
        run: |
          test -f .devnet-keys/oracle.json || { echo "::error::Chave do oráculo não encontrada. Rode o workflow 'Deploy na devnet'."; exit 1; }
          rm -f .devnet-keys/deployer.json .devnet-keys/program.json

      - name: Gravar cotação por consenso no pool
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: .devnet-keys/oracle.json
        run: npm run devnet:price
